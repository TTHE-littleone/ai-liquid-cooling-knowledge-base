name: 每周发布与邮件
on:
  schedule:
    - cron: "7 23 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node scripts/generate-weekly.mjs
      - name: 发送163邮箱周报
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: smtp.163.com
          MAIL_PORT: "465"
        run: python scripts/send-email.py
      - name: 提交周报并触发Netlify
        run: |
          git config user.name "liquid-cooling-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/weekly-generated.json public/reports
          git diff --cached --quiet || git commit -m "report: 发布AI液冷产业周报"
          git push
