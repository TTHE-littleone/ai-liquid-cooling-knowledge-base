name: 每日采集
on:
  schedule:
    - cron: "7 0,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node scripts/collect.mjs
      - name: 提交采集结果
        run: |
          git config user.name "liquid-cooling-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/inbox.json automation/status.json
          git diff --cached --quiet || git commit -m "data: 每日液冷来源采集"
          git push
